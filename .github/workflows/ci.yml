name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Lean
      uses: leanprover-community/setup-lean@v1
      with:
        lean-version: leanprover/lean4:v4.23.0

    - name: Build
      run: |
        cd incidence-theory
        lake build

    - name: Run examples
      run: |
        cd incidence-theory
        lake exe incidence-theory